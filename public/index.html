<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>IPTV Reader</title>
</head>
<body>
<div id="app">
  <header id="appHeader" class="hidden">
    <div class="brand">IPTV <span>Reader</span></div>
    <div class="header-actions">
      <button id="searchToggle" aria-label="Rechercher">⌕</button>
      <button id="refresh" aria-label="Actualiser">↻</button>
      <button id="settingsBtn" aria-label="Paramètres">⚙</button>
    </div>
  </header>
  <div id="searchBar" class="search-bar hidden">
    <input id="searchInput" type="search" placeholder="Rechercher une chaîne, un film, une série…" autocomplete="off">
  </div>
  <main id="content"></main>
  <nav id="nav" class="hidden">
    <button data-tab="home">⌂<small>Accueil</small></button>
    <button data-tab="live">▶<small>TV</small></button>
    <button data-tab="movies">◉<small>Films</small></button>
    <button data-tab="series">▦<small>Séries</small></button>
    <button data-tab="favorites">♥<small>Favoris</small></button>
  </nav>
</div>
<div id="modal" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
